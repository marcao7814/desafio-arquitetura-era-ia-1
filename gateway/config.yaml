# Configuração do AI Gateway (LiteLLM Proxy).
#
# Capacidades lógicas (nome no padrão helpdesk-<tarefa>, ver documentacao/adr.md
# ADR-003): a aplicação só conhece esses nomes, nunca os modelos físicos abaixo.
#
# Para cada capacidade: um destino primário (large), um fallback técnico
# (mesma capacidade, outro provider, também large) e, quando o ADR-002 aceita
# degradar, um fallback com modelo fraco (mini). helpdesk-extract não tem
# fallback fraco — decisão de produto registrada no ADR-002: errar o número
# do pedido custa frete, estoque e cliente, então prefere falhar explícito.
#
# input_cost_per_token/output_cost_per_token: o LiteLLM não conhece o preço
# dos modelos simulados (não estão no cost map oficial). Sem declará-los
# aqui, o custo é calculado como zero e o orçamento de governança nunca
# estoura — pista do provider-fake/README.md. Valores abaixo convertidos
# diretamente da tabela "US$ por 1M tokens" do provider-fake/README.md.
#
# timeout por capacidade, calibrado pela latência real do modelo large em
# modo normal (medida em documentacao/runbook.md e no diagnóstico da v1):
# classify/extract ~1,1s -> timeout 5s; topics ~9,8s por lote -> 15s;
# suggest (sem streaming nesta fase) ~15,9s -> 20s. Um timeout único e baixo
# quebraria suggest/topics em operação normal, não só em falha.
model_list:
  - model_name: helpdesk-classify
    litellm_params:
      model: openai/gpt-fake-large
      api_base: http://provider-fake:8090/openai/v1
      api_key: os.environ/FAKE_OPENAI_KEY
      timeout: 4
      input_cost_per_token: 0.0000025
      output_cost_per_token: 0.00001

  - model_name: helpdesk-classify-fallback
    litellm_params:
      model: anthropic/claude-fake-large
      api_base: http://provider-fake:8090/anthropic
      api_key: os.environ/FAKE_ANTHROPIC_KEY
      timeout: 4
      input_cost_per_token: 0.000003
      output_cost_per_token: 0.000015

  - model_name: helpdesk-classify-weak
    litellm_params:
      model: openai/gpt-fake-mini
      api_base: http://provider-fake:8090/openai/v1
      api_key: os.environ/FAKE_OPENAI_KEY
      timeout: 4
      input_cost_per_token: 0.00000015
      output_cost_per_token: 0.0000006

  - model_name: helpdesk-suggest
    litellm_params:
      model: anthropic/claude-fake-large
      api_base: http://provider-fake:8090/anthropic
      api_key: os.environ/FAKE_ANTHROPIC_KEY
      timeout: 20
      input_cost_per_token: 0.000003
      output_cost_per_token: 0.000015

  - model_name: helpdesk-suggest-fallback
    litellm_params:
      model: openai/gpt-fake-large
      api_base: http://provider-fake:8090/openai/v1
      api_key: os.environ/FAKE_OPENAI_KEY
      timeout: 20
      input_cost_per_token: 0.0000025
      output_cost_per_token: 0.00001

  - model_name: helpdesk-suggest-weak
    litellm_params:
      model: anthropic/claude-fake-mini
      api_base: http://provider-fake:8090/anthropic
      api_key: os.environ/FAKE_ANTHROPIC_KEY
      timeout: 20
      input_cost_per_token: 0.0000008
      output_cost_per_token: 0.000004

  - model_name: helpdesk-topics
    litellm_params:
      model: anthropic/claude-fake-large
      api_base: http://provider-fake:8090/anthropic
      api_key: os.environ/FAKE_ANTHROPIC_KEY
      timeout: 15
      input_cost_per_token: 0.000003
      output_cost_per_token: 0.000015

  - model_name: helpdesk-topics-fallback
    litellm_params:
      model: openai/gpt-fake-large
      api_base: http://provider-fake:8090/openai/v1
      api_key: os.environ/FAKE_OPENAI_KEY
      timeout: 15
      input_cost_per_token: 0.0000025
      output_cost_per_token: 0.00001

  - model_name: helpdesk-topics-weak
    litellm_params:
      model: anthropic/claude-fake-mini
      api_base: http://provider-fake:8090/anthropic
      api_key: os.environ/FAKE_ANTHROPIC_KEY
      timeout: 15
      input_cost_per_token: 0.0000008
      output_cost_per_token: 0.000004

  - model_name: helpdesk-extract
    litellm_params:
      model: openai/gpt-fake-large
      api_base: http://provider-fake:8090/openai/v1
      api_key: os.environ/FAKE_OPENAI_KEY
      timeout: 4
      input_cost_per_token: 0.0000025
      output_cost_per_token: 0.00001

  - model_name: helpdesk-extract-fallback
    litellm_params:
      model: anthropic/claude-fake-large
      api_base: http://provider-fake:8090/anthropic
      api_key: os.environ/FAKE_ANTHROPIC_KEY
      timeout: 4
      input_cost_per_token: 0.000003
      output_cost_per_token: 0.000015

litellm_settings:
  num_retries: 1
  request_timeout: 20
  fallbacks:
    - helpdesk-classify: ["helpdesk-classify-fallback", "helpdesk-classify-weak"]
    - helpdesk-suggest: ["helpdesk-suggest-fallback", "helpdesk-suggest-weak"]
    - helpdesk-topics: ["helpdesk-topics-fallback", "helpdesk-topics-weak"]
    - helpdesk-extract: ["helpdesk-extract-fallback"]

general_settings:
  master_key: os.environ/GATEWAY_MASTER_KEY
  database_url: os.environ/DATABASE_URL
